<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Requested Resource Not Found</title>

  <style>

    html,body
    {
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      background-color: #f5f5f5;
      color: #333;
    }

    body
    {
      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding-top: 12vh;

      overflow: hidden;
    }

    .status-box
    {
      background-color: #ffffff;

      border: 1px solid #d8d8d8;
      border-radius: 12px;

      padding: 50px 60px;

      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);

      text-align: center;

      min-width: 420px;
      max-width: 620px;
    }

    .status-label
    {
        font-weight: 600;
        color: #333;
    }

    .headline
    {
      font-size: 32px;
      font-weight: 600;

      margin-bottom: 18px;

      color: #c62828;
    }

    .detail
    {
      color: #555;

      font-size: 17px;
      line-height: 1.7;
    }

  </style>

</head>

<body>

  <div class="status-box">

    <div class="headline">
      Requested Resource Not Found
    </div>

    <div class="detail">
      <span class="status-label">HTTP Status Code: 404</span><br>
      The requested resource could not be found or is not available.
    </div>

  </div>

</body>

</html>
