<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Service Temporarily Unavailable</title>

  <style>

    html,body
    {
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding-top: 12vh;
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      background-color: #f5f5f5;
      color: #333;
    }

    body
    {
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        justify-content: center;
        align-items: flex-start;

        padding-top: 12vh;

        color: #333;

        overflow: hidden;
    }

    .status-box
    {
      background-color: #ffffff;

      border: 1px solid #d8d8d8;
      border-radius: 12px;

      padding: 50px 60px;

      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);

      text-align: center;

      min-width: 420px;
      max-width: 620px;
    }

    .icon
    {
      font-size: 64px;
      line-height: 1;

      margin-bottom: 18px;

      color: #c62828;
    }

    .headline
    {
      font-size: 32px;
      font-weight: 600;

      margin-bottom: 18px;

      color: #d97706;
    }

    .detail
    {
      color: #555;

      font-size: 17px;
      line-height: 1.7;
    }

    .retry-counter
    {
      color: #333;
      font-weight: bold;
    }

    .dots-loader
    {
      display: flex;

      gap: 8px;
      justify-content: center;

      margin-top: 32px;
    }

    .dots-loader div
    {
      width: 12px;
      height: 12px;

      border-radius: 50%;

      background-color: #333;

      animation: dots-bounce 1.5s infinite ease-in-out;
    }

    .dots-loader div:nth-child(2)
    {
      animation-delay: 0.2s;
    }

    .dots-loader div:nth-child(3)
    {
      animation-delay: 0.4s;
    }

    @keyframes dots-bounce
    {
      0%, 80%, 100%
      {
        transform: scale(0.8);
        opacity: 0.3;
      }

      40%
      {
        transform: scale(1.2);
        opacity: 1;
      }
    }

  </style>

  <script>

    let seconds = 9;

    function updateCounter()
    {
      const counter = document.getElementById("retry-counter");

      counter.innerText = seconds;

      if (seconds > 0)
      {
        seconds--;

        setTimeout(updateCounter, 1000);
      }
      else
      {
        window.location.reload();
      }
    }

    window.onload = updateCounter;

  </script>

</head>

<body>

  <div class="status-box">

    <div class="headline">
      Service Temporarily Unavailable
    </div>

    <div class="detail">
      The requested service is currently starting or temporarily unavailable.<br>
      Retrying automatically in
      <span id="retry-counter" class="retry-counter">5</span>
      seconds ...
    </div>

    <div class="dots-loader">
      <div></div>
      <div></div>
      <div></div>
    </div>

  </div>

</body>

</html>
